html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:#2b2420;

canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#fb{display:none;position:fixed;inset:0;background:#2b2420}
/* 起動中の下地: 最初の場面の壁・テーブル・棚の色だけで描いた軽い絵 + 泡。最初の 3D の絵が出たらふわっと消える */
#ld{position:fixed;inset:0;z-index:2;pointer-events:none;transition:opacity .45s ease;
  background:linear-gradient(to bottom,#ece6dc 0%,#d8d2c9 54%,#d6c0a0 55.6%,#dcc7a7 70.4%,#d2b68b 72.4%,#b68a56 73.6%,#b28450 100%)}
#ld.out{opacity:0}
#ld b{position:absolute;left:50%;top:52%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;opacity:0;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95) 0 18%,rgba(255,255,255,.18) 34% 62%,rgba(150,170,168,.55) 70%,rgba(150,170,168,0) 80%);
  animation:ldUp 1.9s ease-in infinite}
#ld b:nth-child(2){left:calc(50% - 16px);width:8px;height:8px;animation-delay:.45s}
#ld b:nth-child(3){left:calc(50% + 13px);width:10px;height:10px;animation-delay:.9s}
#ld b:nth-child(4){left:calc(50% - 4px);width:7px;height:7px;animation-delay:1.3s}
@keyframes ldUp{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-110px) scale(1.05);opacity:0}}
@media (orientation:portrait) and (min-aspect-ratio:3/5){#ld{background:linear-gradient(to bottom,#ece6dc 0%,#d9d3ca 56%,#d6bf9e 58%,#dcc7a7 80%,#d2b68b 82%,#b68a56 83.2%,#b28450 100%)}}
@media (orientation:landscape){#ld{background:linear-gradient(to bottom,#e6e0d6 0%,#d8d2c9 61%,#d5ba95 62.6%,#d6bc97 78%,#dfcbaa 100%)}#ld b{top:56%}}
@media (prefers-reduced-motion:reduce){#ld b{animation-duration:3.5s}}
#fb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}

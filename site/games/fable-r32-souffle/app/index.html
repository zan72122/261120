<!doctype html>
<html lang="ja">
<head>

<title>スフレ</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6e7d2; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #hand { position: absolute; left: 0; top: 0; width: 84px; height: 84px; margin: -10px 0 0 -30px; opacity: 0; will-change: transform, opacity; filter: drop-shadow(0 3px 6px rgba(80,40,10,.35)); }
  #replay { position: absolute; left: 50%; bottom: 7vh; width: 132px; height: 132px; margin-left: -66px; border-radius: 50%; border: 0; padding: 0;
            background: radial-gradient(circle at 40% 35%, #fff6d8, #ffc44d 60%, #f0a020); box-shadow: 0 8px 0 #c9781a, 0 14px 24px rgba(90,40,0,.35);
            pointer-events: auto; opacity: 0; transform: scale(.4); transition: opacity .5s, transform .6s cubic-bezier(.2,1.6,.4,1); display: none; touch-action: none; }
  #replay.show { opacity: 1; transform: scale(1); }
  #replay svg { width: 70%; height: 70%; margin-top: 4px; }
  #boot { position: fixed; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px; border-radius: 50%; border: 8px solid #f3c98f; border-top-color: #e08a2c; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #dbg { position: fixed; left: 6px; top: 6px; padding: 6px 8px; font: 11px/1.35 ui-monospace, Menlo, monospace; color: #e8ffe8; background: rgba(0,0,0,.62); border-radius: 6px; white-space: pre; pointer-events: auto; max-width: 46vw; z-index: 9; }
  #dbg button { font: 11px ui-monospace, monospace; margin: 4px 4px 0 0; }
</style>
</head>

          fill="#fff" stroke="#8a5a2b" stroke-width="2.5" stroke-linejoin="round" opacity=".92"/>
  </svg>
  <button id="replay" aria-label="replay">

  </button>
</div>

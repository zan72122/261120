<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2d2c4">
<title>鏡の塔</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f2d2c4; overscroll-behavior: none; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  /* 起動中・コンテキスト喪失中：文字なしの「お日さま」 */
  #veil { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(#a9c3ec, #f6cdb8); transition: opacity .6s; z-index: 5; pointer-events: none; }
  #veil.hide { opacity: 0; }
  #veil .sun { width: 96px; height: 96px; border-radius: 50%; background: radial-gradient(#fffbe8, #ffd76a 60%, rgba(255,200,90,0)); animation: sun 1.6s ease-in-out infinite; }
  @keyframes sun { 50% { transform: scale(1.15); } }
  /* もういちど：文字なし、回る矢印の大きな丸ボタン */
  #again { position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); width: 132px; height: 132px; margin-left: -66px; border: 0; border-radius: 50%; padding: 0;
    background: radial-gradient(circle at 40% 35%, #fff9e6, #ffd36b 65%, #f2a93b); box-shadow: 0 6px 18px rgba(120,70,20,.35), inset 0 -6px 0 rgba(200,120,30,.35);
    z-index: 10; touch-action: none; animation: again 1.8s ease-in-out infinite; cursor: pointer; }
  #again[hidden] { display: none; }
  #again svg { width: 70%; height: 70%; margin-top: 4px; }
  @keyframes again { 50% { transform: scale(1.07); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil"><div class="sun"></div></div>
<button id="again" type="button" aria-label="もういちど" hidden>
  <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 18a32 32 0 1 1-30.4 22" fill="none" stroke="#8a4b12" stroke-width="11" stroke-linecap="round"/><path d="M8 30 L22 52 L36 30 Z" fill="#8a4b12" stroke="#8a4b12" stroke-width="5" stroke-linejoin="round"/></svg>
</button>
<!-- file:// でも動くよう、すべて classic script（ES module を直接読まない）。実行時のネットワーク通信なし。 -->
<script src="vendor/three.min.js"></script>
<script src="hero/hero.bundle.js"></script>
<script src="shell/shell.js"></script>
</body>
</html>

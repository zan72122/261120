<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Fridge Groceries</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1816;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    /* Subtle wordless loading shimmer only while assets stream in */
    #veil {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, #2b2723 0%, #171513 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.65s ease;
      pointer-events: none;
      z-index: 20;
    }
    #veil.hidden { opacity: 0; }
    .pulse-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(255, 246, 232, 0.18);
      border-top-color: rgba(255, 246, 232, 0.72);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.min.js",
      "three/addons/": "./vendor/three/"
    }
  }
  </script>
<script src="../../gf-playlog.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <div id="veil"><div class="pulse-ring"></div></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

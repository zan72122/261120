<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#cfe0fa">
<title>三重リング宝石迷路</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe0fa; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
  #view { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

  /* 起動中：文字なし。CSS だけの回る宝石 */
  #splash { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #fdf6ff 0%, #d9e6fb 60%, #c5d8f6 100%); transition: opacity .5s ease; z-index: 5; }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash .gem { width: 84px; height: 84px; transform: rotate(45deg); border-radius: 16px;
    background: conic-gradient(from 0deg, #ff8fb1, #ffd58f, #a8f0b8, #8fd0ff, #c9a8ff, #ff8fb1);
    box-shadow: 0 0 0 10px rgba(255,255,255,.55), 0 10px 30px rgba(120,100,180,.35); animation: spin 2.4s ease-in-out infinite; }
  #splash.fatal .gem { animation: none; filter: grayscale(.6); }
  @keyframes spin { 0% { transform: rotate(45deg) scale(1); } 50% { transform: rotate(225deg) scale(.86); } 100% { transform: rotate(405deg) scale(1); } }

  /* 指の絵と波紋 */
  .hint-finger { position: absolute; left: 0; top: 0; display: none; pointer-events: none; z-index: 3; transform-origin: 21px 6px;
    filter: drop-shadow(0 4px 6px rgba(80,60,120,.35)); will-change: transform, opacity; }
  .hint-dot { position: absolute; left: 3px; top: -12px; width: 36px; height: 36px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,230,140,.7) 45%, rgba(255,230,140,0) 70%); opacity: 0; }
  .ripple { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; pointer-events: none; z-index: 2;
    border: 3px solid rgba(255,255,255,.9); animation: ripple .6s ease-out forwards; }
  .ripple.strong { border-color: rgba(255,236,150,.95); }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }

  /* ?debug=1 */
  .debug-overlay { position: absolute; left: 6px; bottom: 6px; z-index: 10; max-width: min(520px, calc(100% - 12px));
    font: 11px/1.35 ui-monospace, Menlo, monospace; color: #fff; background: rgba(20,20,40,.72); border-radius: 6px; padding: 6px 8px; pointer-events: none; }
  .debug-overlay pre { margin: 0 0 4px; white-space: pre-wrap; word-break: break-all; }
  .debug-overlay.min pre { display: none; }
  .debug-overlay button { pointer-events: auto; font: 11px ui-monospace, Menlo, monospace; margin-right: 4px; padding: 3px 6px; }
</style>
</head>
<body>
<div id="app">
  <div id="splash"><div class="gem"></div></div>
</div>
<!-- 実行時はクラシック script だけ（file:// でも動く）。生成物の作り方は docs/PLAN.md §3 -->
<script src="hero/hero.bundle.js"></script>
<script src="shell/shell.js"></script>
</body>
</html>

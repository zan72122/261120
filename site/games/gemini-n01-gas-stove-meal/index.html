<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>🍳</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1d1712;
      touch-action: none;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #hint-hand {
      position: fixed;
      left: 0;
      top: 0;
      width: 68px;
      height: 68px;
      margin-left: -24px;
      margin-top: -12px;
      pointer-events: none;
      opacity: 0;
      z-index: 10;
      filter: drop-shadow(0 6px 12px rgba(40, 24, 10, 0.35));
      will-change: transform, opacity;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
<script src="../../gf-playlog.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <!-- Gentle translucent hand silhouette used ONLY when idle > 9s, once per idle cycle -->
  <svg id="hint-hand" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M25 8C22.2 8 20 10.2 20 13V32.5L15.4 28.4C13.3 26.5 10.1 26.7 8.3 28.8C6.6 30.8 6.8 33.8 8.7 35.6L21.8 48.2C24.9 51.2 29.1 52.8 33.5 52.8H37.8C46.5 52.8 53.5 45.8 53.5 37.1V26.5C53.5 23.7 51.3 21.5 48.5 21.5C47.5 21.5 46.5 21.8 45.7 22.4C45.3 19.9 43.1 18 40.5 18C39.2 18 38.0 18.5 37.1 19.3C36.4 17.1 34.4 15.5 32 15.5C31.2 15.5 30.5 15.7 29.9 16V13C29.9 10.2 27.7 8 25 8Z"
      fill="rgba(255, 250, 240, 0.88)" stroke="rgba(120, 82, 48, 0.45)" stroke-width="2.4" stroke-linejoin="round"/>
  </svg>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

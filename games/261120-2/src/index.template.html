<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="きんぎょのすいそう">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#2b2420">
<title>ぷくぷく！きんぎょのすいそうおそうじ</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:#2b2420;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#fb{display:none;position:fixed;inset:0;background:#2b2420}
#fb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fb"><img src="<!--FALLBACK_IMG-->" alt=""></div>
<script>
(function(){
  var o={passive:false};
  function stop(e){ if(e.cancelable) e.preventDefault(); }
  ['gesturestart','gesturechange','gestureend','contextmenu','selectstart','dblclick','dragstart'].forEach(function(n){
    document.addEventListener(n,stop,o);
  });
  document.addEventListener('touchmove',stop,o);
  // ダブルタップズーム抑止（素早い2回目の touchend の既定動作を止める）
  var last=0;
  document.addEventListener('touchend',function(e){ var n=Date.now(); if(n-last<350) stop(e); last=n; },o);
})();
</script>
<!--APP_JS-->
</body>
</html>

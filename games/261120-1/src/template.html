<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#d9c8ae">
<title>しゅわーっ！パパのシャツにアイロン</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#d9c8ae;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none;position:fixed;inset:0}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#fallback{position:fixed;inset:0;display:none;background:#d9c8ae center/cover no-repeat}
#splash{position:fixed;inset:0;background:#d9c8ae center/cover no-repeat;pointer-events:none;transition:opacity .45s ease}
#splash.out{opacity:0}
#splash .dots{position:absolute;left:50%;bottom:calc(9% + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;gap:10px;opacity:0;animation:sp-in .4s ease .6s forwards}
#splash .dots i{width:11px;height:11px;border-radius:50%;background:#fffaf2;box-shadow:0 1px 4px rgba(90,70,40,.35);
  animation:sp-bob 1.2s ease-in-out infinite}
#splash .dots i:nth-child(2){animation-delay:.18s}
#splash .dots i:nth-child(3){animation-delay:.36s}
@keyframes sp-in{to{opacity:.9}}
@keyframes sp-bob{0%,100%{transform:translateY(0);opacity:.55}45%{transform:translateY(-9px);opacity:1}}
@media (prefers-reduced-motion:reduce){#splash .dots i{animation:none}}
</style>
<!--__HEAD__-->
</head>
<body>
<canvas id="stage"></canvas>
<div id="fallback" aria-hidden="true"></div>
<div id="splash" aria-hidden="true"><div class="dots"><i></i><i></i><i></i></div></div>
<script>
/* 待ち画面: 最初の場面の写真（posters）をすぐ出し、本体の最初の絵が出たら消す */
(function () {
  var G = window.G = window.G || {};
  var cfg = /*__BOOT__*/{};
  G.LATE = cfg.late || {};
  if (cfg.fallback) G.FALLBACK_IMG = cfg.fallback;
  var sp = document.getElementById('splash');
  G.hideSplash = function (now) {
    if (!sp) return;
    var el = sp; sp = null;
    if (now) { el.parentNode && el.parentNode.removeChild(el); return; }
    el.className = 'out';
    setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 600);
  };
  // 写真は「かごの場面」から始まる時だけ（続きから再開してハンガーやどんぐりの場面になる時は無地のまま）
  try {
    var st = null;
    try { var raw = localStorage.getItem('gf-261120-1'); if (raw) st = JSON.parse(raw).state; } catch (e) { st = null; }
    var floorStart = !st || st === 'basket' || st === 'papa' || st === 'ending' || st === 'iron' || st === 'dock';
    var ps = cfg.posters || [], w = window.innerWidth || 1, h = window.innerHeight || 1, a = Math.log(w / h), best = null, bd = 1e9;
    for (var i = 0; i < ps.length; i++) { var d = Math.abs(Math.log(ps[i].a) - a); if (d < bd) { bd = d; best = ps[i]; } }
    if (floorStart && best && bd < 0.22) sp.style.backgroundImage = 'url("' + best.src + '")';
  } catch (e) { /* 写真なしで続ける */ }
  // 本体は最初の描画の後に読み込む（写真がすぐ出るように）。順番は保つ
  var started = false;
  function fail() {
    try {
      var fb = document.getElementById('fallback'), cv = document.getElementById('stage');
      if (cv) cv.style.display = 'none';
      if (fb) { fb.style.display = 'block'; if (G.FALLBACK_IMG) fb.style.backgroundImage = 'url("' + G.FALLBACK_IMG + '")'; }
      G.hideSplash(true);
    } catch (e) { /* noop */ }
  }
  function go() {
    if (started) return; started = true;
    var list = cfg.scripts || [];
    for (var i = 0; i < list.length; i++) {
      var el = document.createElement('script');
      el.src = list[i]; el.async = false; el.onerror = fail;
      document.body.appendChild(el);
    }
  }
  if (window.requestAnimationFrame) requestAnimationFrame(function () { setTimeout(go, 0); });
  setTimeout(go, 250);
})();
</script>
<!--__SCRIPTS__-->
</body>
</html>
